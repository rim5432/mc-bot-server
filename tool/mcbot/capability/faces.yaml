schema: 1
description: Capability face catalog. Each entry is one player-behavior capability face. source_paths are relative to src/main/java/com/mcbot/mcbotserver/.
  harness_paths are the boundary-D surface that exercises the face. Edit this file, then run `capability init` to refresh
  the DB (statuses / verified_at live in the state overlay and are preserved).
faces:
- id: hunger.fooddata
  name: FoodData verbatim vanilla ticking
  category: hunger
  description: 'Exhaustion / saturation / foodLevel ticked every server tick with vanilla math: saturated fast regen heals
    saturation/6 per 10 ticks, foodLevel >= 18 slow regen (1 HP per 80 ticks), starvation damage below foodLevel 0. natural-regeneration
    gamerule and difficulty gate branches exactly as vanilla.'
  implementation_status: shipped
  vanilla_ref: Player.checkMovementStatistics; FoodData.tick (decompiled 1.20.1)
  source_paths:
  - adapter/VanillaFoodCatalog.java
  - adapter/entity/HungerTicker.java
  - core/process/HungryProcess.java
- id: hunger.movement_exhaustion
  name: Movement exhaustion from distance traveled
  category: hunger
  description: 'Vanilla rates: sprint 0.1 exhaustion per block, walk 0 per block (walking on ground is free), swim / underwater
    wade 0.01 per block. Sprint is 10x the swim rate, not 10x walk.'
  implementation_status: partial
  vanilla_ref: Player.checkMovementStatistics (decompiled 1.20.1)
  deviation: BotBodyEntity.customServerAiStep accumulates no exhaustion naturally, so it is fed manually from horizontal distance.
    Sprint matches vanilla at 0.1/block; walk charges 0.01/block (the vanilla swim rate, not vanilla's zero walk rate) — a
    non-zero baseline so a purely-walking carrier still drains hunger over time.
  source_paths:
  - adapter/entity/HungerTicker.java
  - core/behavior/PathingBehavior.java
  - adapter/entity/BotBodyEntity.java
- id: hunger.eat_chain
  name: 'Eat chain: one finishUsingItem pass'
  category: hunger
  description: Consume sound, probability effects, stack shrink, EAT game event, then FoodData nutrition. Vanilla keeps nibble
    state private, so the adapter consumes exactly one item per firing episode through a rising-edge gate, not a flag poll.
    ConsumptionMechanics owns the physical eat + container recovery; ConsumableUse owns the USE-edge dispatch and eat lifecycle
    events.
  implementation_status: shipped
  vanilla_ref: Item.finishUsingItem; FoodData.eat (decompiled 1.20.1)
  source_paths:
  - core/reflex/EatWhenHungryRule.java
  - core/reflex/AcquireFoodWhenHungryRule.java
  - core/process/HungryProcess.java
  - adapter/entity/BotBodyEntity.java
  - adapter/entity/ConsumptionMechanics.java
  - adapter/ConsumableUse.java
  - adapter/VanillaFoodCatalog.java
  harness_paths:
  - write /player/held/use
- id: hunger.eat_events
  name: Eat lifecycle events on boundary-D stream
  category: hunger
  description: 'EAT_STARTED (pre-selection, urgent: reflex decided to eat, mission about to be preempted), EAT_COMPLETED (result,
    non-urgent: item consumed with full before/after state), EAT_FAILED (reason: NOT_HUNGRY/NOT_EDIBLE/SLOT_EMPTY). EventFacts
    is the single construction point for all three kinds; ConsumableUse emits completed/failed from the BindingActor USE-edge
    dispatch, BotController.routeReflexDecision emits started.'
  implementation_status: shipped
  vanilla_ref: N/A (bot-specific disclosure; vanilla player has no boundary-D event stream)
  deviation: 'Bot-specific: vanilla eating is a silent 32-tick animation; the bot discloses the full lifecycle for harness
    observability so the harness learns WHY the mission was preempted and WHAT was eaten without polling status.'
  source_paths:
  - adapter/BindingActor.java
  - adapter/ConsumableUse.java
  - api/event/EventFacts.java
  - core/tick/BotController.java
  - api/event/EventKind.java
  - core/tick/ReflexClaimInjector.java
- id: consumable.potion
  name: Potion drinking, milk, splash/lingering throw + DRINK lifecycle
  category: consumable
  description: 'Drink potions and milk via finishUsingItem (PotionItem/MilkBucketItem), throw splash/lingering via ThrowableItem
    path. DRINK_STARTED/DRINK_COMPLETED/DRINK_FAILED/POTION_THROWN events on boundary-D. consumeDrink shared helper handles
    shrink + container recovery (glass bottle / bucket) with containerDropped attr when inventory is full. DrinkOnLowHealthRule
    reflex auto-drinks healing potion below 12 HP. Failed reasons: SLOT_EMPTY / NO_POTION / NOT_EDIBLE with itemId. Instant
    health I heals 4 HP ((4 << amplifier) * healthFactor).'
  implementation_status: shipped
  vanilla_ref: PotionItem.finishUsingItem; MilkBucketItem.finishUsingItem; ThrowablePotionItem; ItemUtils.createFilledResult
    (decompiled 1.20.1)
  deviation: Bot consumes in one rising-edge pass (no 32-tick nibble animation); PotionItem.finishUsingItem lines 60-75 are
    Player-only (no shrink, no glass bottle return, no inventory add) so the adapter implements consumeDrink to mirror vanilla
    container recovery. Splash/lingering detected via ThrowablePotionItem instanceof check BEFORE PotionItem (ThrowablePotionItem
    extends PotionItem) to route to throw instead of drink.
  source_paths:
  - adapter/entity/BotBodyEntity.java
  - adapter/entity/ConsumptionMechanics.java
  - adapter/BindingActor.java
  - adapter/ConsumableUse.java
  - api/event/EventFacts.java
  - api/event/EventKind.java
  - core/reflex/DrinkOnLowHealthRule.java
  - core/tick/ReflexClaimInjector.java
  - core/tick/BotController.java
  - adapter/BotAssembly.java
  - adapter/sensing/LevelThreatSensor.java
  - api/reflex/ReflexAction.java
  - api/reflex/ThreatBlackboard.java
  harness_paths:
  - write /player/held/use
