- id: fishing.bite_watch
  name: 'Bite watch and reel: bobber dip detection + rod retrieve'
  category: fishing
  axis: offense
  description: FishBehavior equips the rod, casts (USE rising edge), settles the bobber (5 stable ticks after 30-tick cast
    grace), then watches consecutive BobberSnapshot Y values. A vertical drop >= 0.25 blocks in one tick is the bite — vanilla
    sets DATA_BITING=true which imparts -0.4*random(0.6,1.0) downward velocity. One reel (USE edge) lands the loot; hooked
    entity/item reels immediately. BITE_BUDGET_TICKS=600 no-bite timeout reels and stops. The HungryProcess per-tick food
    scan closes the mission.
  implementation_status: shipped
  vanilla_ref: FishingHook.catchingFish (timeUntilLured 100-600, timeUntilHooked 20-80, nibble 20-40); FishingHook.onSyncedDataUpdated
    (DATA_BITING -> deltaY -0.4); FishingHook.retrieve (BuiltInLootTables.FISHING, open water treasure, rod damage 1/3/5)
    (decompiled 1.20.1)
  source_paths:
  - core/behavior/FishBehavior.java
  - core/process/HungryProcess.java
  - api/process/Fish.java
  - api/process/Overrides.java
