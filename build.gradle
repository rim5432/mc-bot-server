plugins {
    id 'idea'
    id 'java-library'
    id 'checkstyle'
    id 'pmd'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.15.0'
    id 'com.github.spotbugs' version '6.5.11'
    id 'net.ltgt.errorprone' version '5.1.0'
    id 'com.diffplug.spotless' version '8.10.0'

    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.144'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // isolated classpath for the CPD JavaExec task below; must not leak
    // into compile/test classpaths
    cpdTool
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    // bytecode-level architecture gates; see BytecodeArchitectureGateTest
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // last Error Prone core that RUNS on a JDK 17 toolchain
    errorprone 'com.google.errorprone:error_prone_core:2.42.0'
    // NullAway: @Nullable/@NonNull enforcement as an EP plugin.
    // Scoped to api.. only (AnnotatedPackages); runs on -Plint compiles.
    errorprone 'com.uber.nullaway:nullaway:0.11.2'
    // javax.annotation.Nullable for API nullability contracts.
    // compileOnly: RUNTIME-retained annotation in bytecode, no runtime
    // dependency needed (static analysis only).
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    cpdTool 'net.sourceforge.pmd:pmd-cli:7.26.0'
    cpdTool 'net.sourceforge.pmd:pmd-java:7.26.0'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // hard style gates ride every test run - user ruling 2026-08-27:
    // hygiene outweighs ~10s of build time; see doc/guide/build-and-run.md
    dependsOn 'checkstyleMain', 'checkstyleTest', 'spotlessCheck'
    // coverage floor rides as a FINALIZER, not dependsOn: the JaCoCo
    // verification task itself depends on test, so a dependsOn edge here
    // would close a cycle. Finalizers still fail the build on violation.
    finalizedBy 'jacocoTestCoverageVerification'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ===== Static analysis =====
// Hard gates (checkstyle semantic set + spotlessCheck) ride the
// default `test` flow since the 2026-08-27 promotion (zero-violation
// baseline proved first; user accepted the ~10s cost). Red walls
// (PMD since its 2026-08-27 paydown, CPD at >=140 tokens, SpotBugs
// since the 2026-09-01 first-triage flip) and the Error Prone pass
// run behind -Plint; postures in doc/guide/build-and-run.md.
checkstyle {
    // 14.x line, P3 of the 2026-09-01 lint-posture round: the analyzer
    // JVM runs on Java 21 via the launcher below, so the mod's Java 17
    // toolchain no longer pins the checkstyle version
    toolVersion = '14.0.0'
}
tasks.withType(Checkstyle).configureEach {
    // checkstyle 13+/14+ ship Java-21 bytecode; the mod toolchain locks
    // Java 17, so ONLY the analyzer JVM upgrades: auto-detected Temurin
    // 21 on dev machines, preinstalled Temurin 21 on ubuntu-latest
    // runners (/usr/lib/jvm). Compilation itself stays on Java 17.
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
pmd {
    // PMD 7 needs Gradle >= 8.6; the built-in plugin defaults to 6.55.0
    toolVersion = '7.26.0'
    consoleOutput = true
    // explicit wiring required: leaving it to the config/pmd default path
    // silently runs the plugin's built-in ruleset instead (observed)
    ruleSetFiles = files('config/pmd/ruleset.xml')
}
tasks.withType(Pmd).configureEach {
    enabled = project.hasProperty('lint')
    // RED WALL since the 2026-08-27 paydown: zero findings held, so a
    // regression now breaks the lint run instead of just reporting it.
}

// SpotBugs analyzes only api/ + core/: their closure references no MC
// types by contract (boundary A), so no auxclasspath to moddev's jars is
// needed - anywhere else the analyzer would drown in missing-class noise.
spotbugs {
    toolVersion = '4.10.4'
    // triaged suppressions, each Match carrying its justification
    // inline; a new finding lands here with a reason or gets fixed
    excludeFilter = file('config/spotbugs/exclude.xml')
}
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    enabled = project.hasProperty('lint')
    // RED WALL since the 2026-09-01 first-triage flip: all findings at
    // flip time were fixed at the root or suppressed with justification
    // (config/spotbugs/exclude.xml), so a new finding now breaks the
    // lint run instead of just reporting it.
    onlyAnalyze = ['com.mcbot.mcbotserver.api.-', 'com.mcbot.mcbotserver.core.-']
}

// Error Prone rides compilation itself, so it must be off in every plain
// compile flow other agents run; -Plint turns it into a diagnostic pass.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        enabled = project.hasProperty('lint')
        disableWarningsInGeneratedCode = true
        // ReferenceEquality OFF: identity comparisons are pervasive and
        // deliberate here (arbiter seats, entity bindings) - same ruling
        // that dropped CompareObjectsWithEquals from the PMD set
        check('ReferenceEquality', net.ltgt.gradle.errorprone.CheckSeverity.OFF)

        // ===== Promoted guards (2026-08-27 static-analysis wave) =====
        // Zero-violation baseline verified at promotion; each is a
        // regression guard, not a paydown target. Two deliberate
        // exemptions are annotated in source: BotControlSocket.serve
        // restores the interrupt flag instead of suppressing, and
        // CrashReporter.consoleFallback carries @SuppressWarnings("SystemErr")
        // as the ADR-0005 D4 crash-terminal fallback.
        // Preconditions is intentionally absent: zero Guava on the
        // compile classpath makes it a no-op check.
        check('StreamResourceLeak', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        check('JdkObsolete', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        check('DefaultCharset', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        check('StringCharset', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        // UseLocale is not a valid checker name in EP 2.42.0 (removed/
        // renamed upstream); locale-less case conversions are rare here
        // and covered by review.
        check('MissingOverride', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        check('EqualsIncompatibleType', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        // NonAtomicVolatile is not a valid checker name in EP 2.42.0;
        // the single volatile field (BotControlSocket.listener) uses
        // simple assignment only, reviewed.
        check('InterruptedExceptionSwallowed', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        check('StringCaseLocaleUsage', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        check('SystemOut', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        // SystemErr is not a separate checker in EP 2.42.0; SystemOut
        // covers both System.out and System.err. CrashReporter carries
        // @SuppressWarnings("SystemOut") as the ADR-0005 D4 fallback.
        check('NonApiType', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)

        // ===== NullAway (2026-08-27 static-analysis wave) =====
        // @Nullable/@NonNull enforcement for the api.. layer only.
        // api is the harness contract; Javadoc says "never null" /
        // "may return null" everywhere, NullAway turns that into a
        // compile-time check. Runs on -Plint only (rides EP).
        check('NullAway', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        option('NullAway:AnnotatedPackages', 'com.mcbot.mcbotserver.api')
    }
}

// NullAway is off for test compilation: tests deliberately pass null
// to api constructors inside assertThrows to verify null-rejection
// contracts (e.g. new ItemView(null, 1, "")); flagging those is noise.
tasks.named('compileTestJava').configure {
    options.errorprone {
        check('NullAway', net.ltgt.gradle.errorprone.CheckSeverity.OFF)
    }
}

// ===== Test-quality gates and lenses =====
// JaCoCo carries ONE regression floor since the 2026-09-01 user ruling
// (P2 of the external lint-posture report): pooled instruction coverage
// over the offline-tested layers may not drop below 95% of the measured
// baseline, plus a per-package catastrophic-collapse guard. PIT stays a
// manual research lens - scoped rounds and reports, no thresholds.
//
// Engine-covered classes are dropped at the class-directory level, not
// via rule excludes: the BUNDLE rule computes over the whole bundle
// whatever its excludes contain (observed 09-01: dotted and slashed
// rule excludes both left the ratio at the whole-bundle 35%), and
// PACKAGE-rule excludes match dotted names only. Filtering the analysis
// input once makes the report and the gate see the same 88.63% view.
def coverageExclusions = [
        'com/mcbot/mcbotserver/McBotServer*',   // mod entry, boots the engine
        'com/mcbot/mcbotserver/adapter/**',     // device layer, engine-covered
        'com/mcbot/mcbotserver/client/**',      // dev client entry
        'com/mcbot/mcbotserver/gametest/**'     // engine scenarios
]
jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: coverageExclusions)
    }))
    reports {
        xml.required = true   // machine-readable for gate analysis
        html.required = true
    }
}
tasks.named('jacocoTestCoverageVerification') {
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: coverageExclusions)
    }))
    // Baseline measured 2026-09-01: 88.63% pooled instruction over the
    // 24 offline-tested packages. Floor = 95% of baseline, rounded down
    // - it protects against decay, it is not an absolute bar (a bare
    // percentage invites no-assertion tests; 95%-of-baseline only
    // fires on real regression).
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.84
            }
        }
        rule {
            // collapse guard: no single offline-tested package below
            // half-covered. Thinnest today is core/command at 51.7%
            // (the watch list's known debt); a NEW package must ship
            // with its tests per workplan discipline.
            element = 'PACKAGE'
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.49
            }
        }
    }
}

pitest {
    // Scoped rounds pass -PpitClasses/-PpitTests (comma-joined
    // patterns); the owed-baselines round used them to score the
    // PathingBehavior+MineProcess pair without the minion classpath
    // choking on adapter classes' MC references.
    targetClasses = project.hasProperty('pitClasses') ? [project.pitClasses] : ['com.mcbot.mcbotserver.*']
    targetTests = project.hasProperty('pitTests') ? [project.pitTests] : ['com.mcbot.mcbotserver.*']
    excludedTestClasses = ['com.mcbot.mcbotserver.gametest.*']
    junit5PluginVersion = '1.2.1'
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        // palantir-java-format was picked because its output IS the
        // MC-ecosystem convention: Sun/Oracle-style 4-space indent,
        // K&R braces, 120 columns - same axes Mojang sources and the
        // NeoForge guidelines mandate. Version ships Java-11 bytecode
        // and runs on the JDK 17 daemon.
        palantirJavaFormat('2.97.0')
        trimTrailingWhitespace()
        endWithNewline()
    }
}
// spotlessCheck rides the default `test` flow with checkstyle (see
// tasks.named('test') above); apply tasks stay runnable at any time.
tasks.register('cpdCheck', JavaExec) {
    group = 'verification'
    description = 'Copy-paste detection over src/main/java and src/test/java (PMD CPD).'
    classpath = configurations.cpdTool
    mainClass = 'net.sourceforge.pmd.cli.PmdCli'
    args 'cpd',
         '--language', 'java',
         '--dir', layout.projectDirectory.dir('src/main/java').asFile.absolutePath,
         '--dir', layout.projectDirectory.dir('src/test/java').asFile.absolutePath,
         '--minimum-tokens', '140',
         '--format', 'text'
    // RED WALL at >=140 tokens: the main-side duplication backlog was
    // cleared on 2026-08-27 (handler guards, ItemStack toView,
    // gametest pool filler); 140 sits just above the largest surviving
    // TEST-side copy (131) so the gate fires only on new main-scale
    // duplication. Sub-threshold dups are periodic manual review.

    enabled = project.hasProperty('lint')
}

// One-command quality verdict: compile both source sets, then run every
// gate and analyzer in its configured posture - checkstyle/spotless as
// plain gates, PMD/CPD/SpotBugs as red walls. The JaCoCo floor rides the
// `test` flow, not qualityCheck; PIT stays a research lens outside every
// per-commit check. Entry point: mcbot_tool.py lint.
tasks.register('qualityCheck') {
    group = 'verification'
    description = 'Full static-analysis verdict (compile + style + walls + dashboards).'
    dependsOn 'compileJava', 'compileTestJava',
            'checkstyleMain', 'checkstyleTest', 'spotlessCheck',
            'pmdMain', 'pmdTest', 'cpdCheck',
            'spotbugsMain', 'spotbugsTest'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
