# Offline gate: compile + offline JUnit + style checks (checkstyle and
# spotlessCheck ride the default test task). Engine gametests need a real
# game instance and stay a local step (python tool/mcbot_tool.py build
# runGameTest).
#
# The toolbox's gradle wrapper is invoked directly here: the local
# cross-process lock layer (tool/mcbot_tool.py) exists to serialize
# concurrent agents on one checkout, which CI does not have.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run offline tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon compileJava test
