# Offline gate: compile + offline JUnit + style checks (checkstyle and
# spotlessCheck ride the default test task). Engine gametests need a real
# game instance and stay a local step (python tool/mcbot_tool.py build
# runGameTest).
#
# A parallel static-analysis job runs the full qualityCheck verdict
# (-Plint): PMD, CPD, SpotBugs, and the Error Prone + NullAway compile
# pass - findings surface on the mirror instead of waiting for the next
# local promotion round.
#
# The toolbox's gradle wrapper is invoked directly here: the local
# cross-process lock layer (tool/mcbot_tool.py) exists to serialize
# concurrent agents on one checkout, which CI does not have.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run offline tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon compileJava test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capability matrix validation
        run: |
          python tool/mcbot_tool.py capability init
          python tool/mcbot_tool.py capability qa-import qa-results/ranged-survival/qa-test-cases-ranged-survival.csv
          python tool/mcbot_tool.py capability scan-gametest --strict
          python tool/mcbot_tool.py capability validate

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Full static-analysis verdict
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon qualityCheck -Plint --continue
