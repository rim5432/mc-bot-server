# Single source of truth for code-health rule status, abstractions, and open items.
# code-health.md carries the narrative (why each rule exists, round history,
# ruling anchors); this file carries the machine-readable state.
# doc check verifies that code-health.md's status claims match this file.
# Update this file FIRST when a rule changes status or an item opens/closes,
# then update code-health.md to match.

meta:
  last_updated: 2026-09-02
  source_doc: doc/architecture/code-health.md

rules:
  - id: H-R1
    name: Reflection is the exception
    invariant: "Collaborator unit tests live same-package with direct package-private access; reflection exists only in PathingTestAccess for integration-level mid-drive state"
    gate: hygiene.ReflectionDoorCheck
    status: gated
    gated_date: 2026-08-24

  - id: H-R2
    name: No inline FQNs
    invariant: "A type used in code is imported; FQNs appear only where Java demands them"
    gate: null
    status: review-only

  - id: H-R3
    name: English-only everywhere
    invariant: "Zero CJK codepoints in any .md file and any Java source"
    gate: hygiene.EnglishOnlyScan
    status: gated
    gated_date: 2026-08-24

  - id: H-R4
    name: Wire keys frozen
    invariant: "Serialized boundary-D keys survive field renames"
    gate: boundaryd.WireVocabularyGateTest
    status: gated
    gated_date: 2026-08-25

  - id: H-R5
    name: Gametest inventory
    invariant: "The registered @GameTest set cannot silently shrink; verification currency is receipt-backed"
    gate: hygiene.GametestInventoryCheck
    status: gated
    gated_date: null

  - id: H-R6
    name: Geometry spectrum rationale
    invariant: "Threshold constants document their partial-top-spectrum reasoning"
    gate: null
    status: review-only

  - id: H-R7
    name: Package structure
    invariant: "Main modules single-level, module names never reused as subpackages; test packages mirror main or are sanctioned metas"
    gate: architecture.PackageStructureGateTest
    status: gated
    gated_date: 2026-08-25

  - id: H-R8
    name: Contract markers present
    invariant: "Every src/main implementer of a boundary interface carries its contract: see pointer (AGENTS.md 1.4.3.1)"
    gate: architecture.BoundaryContractMarkerTest
    status: gated
    gated_date: 2026-08-25

  - id: H-R9
    name: Review claims cite or are unverified
    invariant: "Every factual claim in a review carries a file:line or doc-anchor citation; quoted promises checked against anchor; abstraction proposals check abstraction-status table first"
    gate: null
    status: review-only
    status_date: 2026-08-27

  - id: H-R10
    name: Style law is machine-owned
    invariant: "AGENTS section 1 semantic rules (naming, javadoc presence, import purity, width) fail checkstyle; layout is formatter-canonical (Spotless/palantir) and never hand-reformatted"
    gate: checkstyleMain + checkstyleTest + spotlessCheck (default test flow)
    status: gated
    gated_date: 2026-08-27

  - id: H-R11
    name: Lint postures are pinned
    invariant: "The split between hard gates (default test flow) and -Plint dashboards cannot silently shift; a posture change is a ruling landing gate + posture table + ruling together"
    gate: architecture.LintPostureGateTest
    status: gated
    gated_date: 2026-08-27

  - id: H-R12
    name: Decision index parity
    invariant: "boundaries.md decision index max equals ledger.md body max; every verdict has a citation-resolution row"
    gate: architecture.DecisionIndexSyncGateTest
    status: gated
    gated_date: 2026-08-29

